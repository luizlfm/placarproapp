<div class="ce-wrap" *ngIf="vm$ | async as vm">
  <ng-container *ngIf="vm.linhas.length || vm.aleatorios.length; else semEsc">
    <!-- Aviso "Defina a posição..." removido a pedido do user — ocupava topo
         em landscape mobile e dava sensação de tela travada. A info da posição
         já aparece embaixo de cada camisa quando configurada. -->

    <div class="ce-campo" [class.ce-campo-aleatorio]="vm.modo === 'aleatorio'">
      <!-- marcações do campo -->
      <span class="ce-linha-meio"></span>
      <span class="ce-circulo"></span>
      <span class="ce-area ce-area-cima"></span>
      <span class="ce-area ce-area-baixo"></span>

      <!-- MODO FORMAÇÃO -->
      <ng-container *ngIf="vm.modo === 'formacao'">
        <div class="ce-linha" *ngFor="let linha of vm.linhas">
          <div
            class="ce-jogador"
            *ngFor="let j of linha.jogadores"
            [class.ce-clicavel]="editavel"
            (click)="onSelecionar(j)"
          >
            <div class="ce-camisa">
              <ion-icon name="shirt" aria-hidden="true"></ion-icon>
              <span class="ce-num">{{ j.numero || '–' }}</span>
              <ion-icon *ngIf="editavel" class="ce-edit-hint" name="create" aria-hidden="true"></ion-icon>
            </div>
            <div class="ce-pos" *ngIf="j.nome">{{ j.nome }}</div>
          </div>
        </div>
      </ng-container>

      <!-- MODO ALEATÓRIO (sem posições) -->
      <ng-container *ngIf="vm.modo === 'aleatorio'">
        <div
          class="ce-jogador ce-jogador-abs"
          *ngFor="let a of vm.aleatorios"
          [style.top.%]="a.top"
          [style.left.%]="a.left"
        >
          <div class="ce-camisa">
            <ion-icon name="shirt" aria-hidden="true"></ion-icon>
            <span class="ce-num">{{ a.numero || '–' }}</span>
          </div>
          <div class="ce-pos" *ngIf="a.nome">{{ a.nome }}</div>
        </div>
      </ng-container>
    </div>
  </ng-container>

  <ng-template #semEsc>
    <div class="ce-vazio">Escalação não definida</div>
  </ng-template>
</div>
